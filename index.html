<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Personal Ledger (b15)</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#2F5D4F" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<link rel="stylesheet" href="./style.css" />
<style>
  html, body { background: #EFEBE1; margin: 0; }
  #boot { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: ui-sans-serif, system-ui, sans-serif; color: #8A8672; font-size: 14px; }
  #boot-error { display: none; padding: 24px; font-family: ui-monospace, monospace; color: #9C4A32;
    background: #F4E3DC; white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<div id="root"><div id="boot">Loading your ledger… (build b15)</div></div>
<div id="boot-error"></div>

<script>
  // Only reports a failure while the app is still starting up.
  window.addEventListener("error", function (e) {
    if (window.__booted) return;
    var box = document.getElementById("boot-error");
    box.style.display = "block";
    box.textContent = "Couldn't start the app (build b15):\n\n" + (e.message || "unknown error") +
      "\n\nTry closing and reopening it. If it keeps happening, screenshot this box.";
  });
</script>
<script>
  // Arabic typing: let each text box and line pick its own direction from what is written in it.
  (function () {
    var q = "input,textarea,h1,.text-sm:not(.flex),.text-xs:not(.flex),.text-lg:not(.flex)", t = 0;
    function run() { t = 0; document.querySelectorAll(q).forEach(function (e) { if (!e.hasAttribute("dir")) e.setAttribute("dir", "auto"); }); }
    new MutationObserver(function () { if (!t) t = requestAnimationFrame(run); }).observe(document.documentElement, { childList: true, subtree: true });
  })();
</script>
<script src="./fb.js"></script>
<script src="./storage-shim.js"></script>
<script src="./app.js"></script>
<script>
  // On a new build, clear any old cached copy once, then register the offline cache.
  (async function () {
    var BUILD = "b15";
    try {
      if (localStorage.getItem("ledger-build-seen") !== BUILD) {
        if (navigator.serviceWorker) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
        localStorage.setItem("ledger-build-seen", BUILD);
      }
    } catch (e) {}
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).catch(function () {});
  })();
</script>
</body>
</html>
